<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DICTATOR | Enter the World</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  font-family: Arial, Helvetica, sans-serif;
  color: white;
  background: #03040a;
  overflow-x: hidden;
}

.hero {
  position: relative;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 30px 20px;
  overflow: hidden;
  isolation: isolate;
  background:
    radial-gradient(ellipse at 50% 40%,
      rgba(105, 0, 30, 0.35), transparent 45%),
    radial-gradient(ellipse at 20% 80%,
      rgba(0, 80, 130, 0.18), transparent 45%),
    linear-gradient(135deg, #03040a, #100610, #02030a);
}

/* Animated 3D background */
.hero::before {
  content: "";
  position: absolute;
  inset: -50%;
  z-index: -1;
  background: repeating-linear-gradient(
    0deg,
    transparent 0px,
    transparent 49px,
    rgba(255, 0, 60, 0.12) 50px
  );
  transform: perspective(500px) rotateX(60deg) rotateZ(-12deg);
  animation: moveGrid 12s linear infinite;
  mask-image: linear-gradient(transparent, black, transparent);
}

.hero::after {
  content: "";
  position: absolute;
  width: 280px;
  height: 280px;
  border-radius: 50%;
  background: #e50936;
  filter: blur(130px);
  opacity: 0.18;
  z-index: -1;
  animation: glow 4s ease-in-out infinite alternate;
}

.top-label {
  font-size: 11px;
  letter-spacing: 6px;
  color: #ff496b;
  margin-bottom: 24px;
  animation: fadeUp 1s ease both;
}

h1 {
  font-size: clamp(48px, 12vw, 115px);
  font-weight: 1000;
  letter-spacing: 5px;
  line-height: 1;
  color: #fff;
  text-shadow:
    1px 1px 0 #bcbcbc,
    2px 2px 0 #888,
    3px 3px 0 #555,
    4px 4px 0 #333,
    0 0 20px rgba(255, 0, 60, 0.5),
    0 0 60px rgba(255, 0, 60, 0.2);
  animation: titleIn 1.2s ease both;
}

h1 span {
  color: #ff1744;
  text-shadow:
    1px 1px 0 #a30021,
    2px 2px 0 #740017,
    0 0 25px rgba(255, 23, 68, 0.8);
}

.line {
  width: 90px;
  height: 3px;
  margin: 28px 0;
  background: linear-gradient(90deg, transparent, #ff1744, transparent);
  box-shadow: 0 0 15px #ff1744;
}

.subtitle {
  font-size: clamp(14px, 3vw, 19px);
  letter-spacing: 4px;
  color: #f0f0f0;
  margin-bottom: 18px;
  animation: fadeUp 1.3s ease both;
}

.description {
  max-width: 520px;
  color: #aaaab7;
  font-size: 14px;
  line-height: 1.9;
  margin-bottom: 35px;
  animation: fadeUp 1.5s ease both;
}

.enter-btn {
  position: relative;
  display: inline-block;
  padding: 17px 38px;
  color: white;
  background: linear-gradient(135deg, #ff1744, #a00025);
  border: 1px solid #ff5877;
  border-radius: 4px;
  text-decoration: none;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 4px;
  box-shadow: 0 0 25px rgba(255, 23, 68, 0.3);
  transition: 0.3s ease;
  animation: fadeUp 1.7s ease both;
}

.enter-btn:hover {
  transform: translateY(-5px) scale(1.04);
  box-shadow: 0 0 40px rgba(255, 23, 68, 0.65);
  background: linear-gradient(135deg, #ff315a, #d00032);
}

.enter-btn:active {
  transform: scale(0.97);
}

.footer {
  position: absolute;
  bottom: 20px;
  color: #555563;
  font-size: 10px;
  letter-spacing: 3px;
}

@keyframes moveGrid {
  from { background-position: 0 0; }
  to { background-position: 0 100px; }
}

@keyframes glow {
  from { transform: scale(0.8); opacity: 0.12; }
  to { transform: scale(1.3); opacity: 0.25; }
}

@keyframes titleIn {
  from { opacity: 0; transform: perspective(500px) translateY(35px) rotateX(15deg); }
  to { opacity: 1; transform: perspective(500px) translateY(0) rotateX(0); }
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 480px) {
  h1 {
    letter-spacing: 2px;
  }

  .top-label {
    letter-spacing: 4px;
  }

  .subtitle {
    letter-spacing: 2px;
  }

  .description {
    font-size: 13px;
  }

  .enter-btn {
    padding: 16px 27px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>

<body>

<main class="hero">

  <div class="top-label">WELCOME TO A NEW ERA</div>

  <h1>DICT<span>ATOR</span></h1>

  <div class="line"></div>

  <p class="subtitle">ENTER THE WORLD OF CINEMA</p>

  <p class="description">
    Step into a world of powerful stories, unforgettable moments
    and cinematic experiences. Discover entertainment beyond
    imagination, all in one place.
  </p>

  <a
    class="enter-btn"
    href="https://cool-apk.my.canva.site/dictator"
    target="_blank"
    rel="noopener noreferrer"
  >
    CLICK HERE &nbsp; &#8594;
  </a>

  

</main>

</body>
</html>
